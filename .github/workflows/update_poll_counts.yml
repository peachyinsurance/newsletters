name: Update Poll Counts

on:
  # Cron disabled — poll counts paused at user request. Re-enable by
  # un-commenting the schedule block below. Manual workflow_dispatch
  # still works so you can run it ad-hoc to verify it still works.
  #
  # schedule:
  #   # Polling window: Friday → Sunday only, every 30 min between 12:00–23:30 UTC.
  #   # That covers ~7 AM EST (Fri morning send time) through 7:30 PM EST Sunday,
  #   # which is when readers actually click vote links. Mon–Thu polling was
  #   # noise — newsletter hadn't been sent yet so click counts were unchanged.
  #   #
  #   # Cron weekday: 5=Fri 6=Sat 0=Sun
  #   - cron: '*/30 12-23 * * 5,6,0'
  workflow_dispatch:

permissions:
  contents: write

# Only the newest poll-count snapshot matters; collapse overlapping runs so
# they don't race each other on the gh-pages push.
concurrency:
  group: update-poll-counts
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Pull poll click data + write JSON
        env:
          BEEHIIV_API_KEY:            ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_ECC_PUBLICATION_ID: ${{ secrets.BEEHIIV_ECC_PUBLICATION_ID }}
          NOTION_API_KEY:             ${{ secrets.NOTION_API_KEY }}
          NOTION_POLLS_DB_ID:         ${{ secrets.NOTION_POLLS_DB_ID }}
          NOTION_PETS_DB_ID:          ${{ secrets.NOTION_PETS_DB_ID }}
          NOTION_RESTAURANTS_DB_ID:   ${{ secrets.NOTION_RESTAURANTS_DB_ID }}
          # Required at import time: update_poll_counts imports
          # assemble_newsletter_page, which reads os.environ["NOTION_PARENT_PAGE_ID"].
          NOTION_PARENT_PAGE_ID:      ${{ secrets.NOTION_PARENT_PAGE_ID }}
        run: python Beehiiv/Code/update_poll_counts.py

      - name: Stage poll-counts.json for gh-pages
        run: |
          mkdir -p /tmp/poll_staging
          cp review-app/public/poll-counts.json /tmp/poll_staging/poll-counts.json
          echo "Staged $(ls -la /tmp/poll_staging/)"

      - name: Publish to gh-pages (keep_files preserves existing site)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/poll_staging
          publish_branch: gh-pages
          keep_files: true
          commit_message: 'update poll counts (auto)'
