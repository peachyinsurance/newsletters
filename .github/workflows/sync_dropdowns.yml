name: Sync Workflow Dropdowns

# Auto-syncs every workflow's `newsletter:` dropdown options with the
# canonical NEWSLETTERS_DICT in newsletters_config.py. Fires when that file
# changes on main — so adding/removing a newsletter only requires editing
# the single Python dict; this job picks it up and rewrites every workflow.

on:
  push:
    branches: [main]
    paths:
      - 'NewsletterCreation/Code/newsletters_config.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Verify push token is set
        env:
          PAT: ${{ secrets.RUNNER_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::RUNNER_PAT secret is empty/unset for this repo. Add a PAT"
            echo "::error::with 'repo' + 'workflow' scope as the Repository secret RUNNER_PAT"
            echo "::error::(Settings > Secrets and variables > Actions). Editing the PAT's"
            echo "::error::scopes in Developer Settings does NOT update the stored secret value."
            exit 1
          fi
          echo "✓ RUNNER_PAT is present"

      - uses: actions/checkout@v4
        with:
          # MUST be a PAT with the `workflow` scope (fine-grained: Workflows
          # read+write). The default GITHUB_TOKEN is a GitHub App token, which
          # GitHub forbids from creating/updating files under .github/workflows/
          # — this job rewrites those files, so it needs a real PAT. checkout
          # persists this token, so the `git push` below authenticates with it.
          token: ${{ secrets.RUNNER_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync dropdowns
        run: python NewsletterCreation/Code/sync_workflow_dropdowns.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if [[ -n "$(git status --porcelain .github/workflows/)" ]]; then
            git add .github/workflows/*.yml
            git commit -m "sync workflow dropdowns to newsletters_config"
            git push origin main
            echo "✓ Pushed dropdown sync to main"
          else
            echo "✓ Already in sync — nothing to commit"
          fi
